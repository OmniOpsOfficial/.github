name: Sync Organization Templates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Global Governance Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run GitHub File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.ORG_SYNC_TOKEN }}
          COMMIT_PREFIX: '[Governance Sync] '
          PR_LABELS: 'automated-pr, baseline-update'
          PR_BODY: |
            ### OmniOps Template Synchronization
            This automated Pull Request updates the local repository to match the latest centralized engineering standards. 
            
            **Action Required:** Review and merge to maintain organizational compliance. Do not edit these baseline files locally.
